name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TARGET: thumbv6m-none-eabi

jobs:
  build:
    name: 构建 / 测试 / 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      # 库本体（裸机目标）：clippy 严格模式，任何警告都算失败
      - name: clippy（lib / thumbv6m）
        run: cargo clippy --lib --target $TARGET --release -- -D warnings

      # 全部例程（裸机目标）
      - name: 构建全部例程
        run: cargo build --target $TARGET --release --examples

      # 关掉默认 feature：验证「零外部依赖」这条路仍然通
      - name: 零依赖构建（--no-default-features）
        run: cargo build --target $TARGET --release --no-default-features

      # 宿主侧单元测试（76 项寄存器编码 / 时序计算 / 换算逻辑）
      - name: 单元测试
        run: cargo test --lib

      - name: 格式检查
        run: cargo fmt --all -- --check

  docs:
    name: 文档构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 用宿主目标构建文档，和 docs.rs 的做法一致
      - name: cargo doc
        run: cargo doc --no-deps

      - name: 文档警告统计
        run: cargo doc --no-deps 2>&1 | grep -c "^warning" || true
